<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bilverkstaden – förhandsvisning</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #222; color: #fff; }
      #stage { position: relative; width: 100vw; height: 100vh; }
      #info { position: fixed; left: 8px; bottom: 6px; font-size: 12px; opacity: 0.7; color: #333; pointer-events: none; }
      #bar { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      #bar button { border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
      .shot #bar, .shot #info { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bar"></div>
    <div id="info"></div>
    <script type="module" src="/src/labpreview.ts"></script>
  </body>
</html>
